services:
  redis:
    image: redis:alpine
    container_name: redis-container
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - mynetwork
    environment:
      - REDIS_PASSWORD=mysecretpassword
    command: ["redis-server", "--requirepass", "mysecretpassword"]
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      retries: 3
      timeout: 10s

volumes:
  redis-data:
    driver: local

networks:
  mynetwork:
    driver: bridge
