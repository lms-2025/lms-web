[package]
name = "lms_server"
version = "0.1.0"
edition = "2021"

[dependencies]
argon2 = "0.5.3" # for password hashing
axum = { version = "0.8.1", features = [
    "http1",
    "http2",
    "ws",
    "json",
    "macros",
    "multipart",
    "ws",
] } # for web framework
chrono = "0.4.39" # for date and time
cron = "0.14.0" # for cron job
derive_more = { version = "1.0.0", features = [
    "full",
] } # for trait like Clone, Copy, etc
dotenv = "0.15.0" # for environment variable
flexi_logger = "0.29.8" # for logging
futures-util = "0.3.31"
jsonwebtoken = "9.3.0" # for jwt
lettre = "0.11.11" # for email
log = "0.4.22" # for logging
mongodb = { version = "3.1.1" } # for mongodb
once_cell = "1.20.2" # for lazy static
redis = "0.28.0" # for in memory cache
serde = "1.0.217" # for serialization and deserialization
serde_json = "1.0.135" # for json
tokio = { version = "1.43.0", features = ["full"] } # for async runtime
tower = { version = "0.5.2", features = ["full"] } # for async

[profile.release]
lto = true # for link time optimization
